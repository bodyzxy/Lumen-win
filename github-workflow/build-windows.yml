# 在 GitHub 的 Windows 机器上打包 Lumen 安装包（.exe 和 .msi）
# · 手动运行（Actions › Build Windows installer › Run workflow）：安装包作为构建产物下载
# · 推送 v 开头的标签（例如 git tag v1.0.0 && git push --tags）：自动建一个 Release 草稿并附上安装包
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Lumen ${{ github.ref_name }} for Windows'
          releaseBody: 'Download **Lumen_x.y.z_x64-setup.exe**, double-click it and follow the installer.'
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
